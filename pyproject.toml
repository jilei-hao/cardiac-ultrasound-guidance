[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-ultrasound-guidance"
version = "0.1.0"
description = "Real-time cardiac ultrasound guidance system with deep learning inference"
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Paradigm Team"}
]
keywords = ["ultrasound", "cardiac", "guidance", "deep-learning", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core numerical and imaging
    "numpy",
    "opencv-python",
    "mss",
    "Pillow",
    "matplotlib",
    "pandas",
    
    # Deep learning
    "torch",
    "torchvision",
    "einops",  # vendored USGR PoseTransformer (probe-pose guidance)
    
    # Rendering
    "pyrender",
    "trimesh",
    "cairosvg",
    
    # GUI / Cross-platform windowing
    "PySide6",
    
    # Utilities
    "requests",
    "python-dotenv>=1.0.0",
    
    # macOS window management
    "pyobjc==10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.scripts]
cusg-legacy-main = "legacy_main:main"
cusg-guidance-ui = "guidance_ui:main"
cusg-record = "record:main"
cusg-probe-render = "probe_render:main"
test-clarius-windows = "data_access.clarius.test_with_qt:main"

[project.urls]
Homepage = "https://github.com/paradigm/cardiac-ultrasound-guidance"
Repository = "https://github.com/paradigm/cardiac-ultrasound-guidance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.stl", "*.png", "*.jpg"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
